id: lifesats_items
name: Life Satisfaction Measures (6 items)
instructions: >
  For each of the statements below, please indicate to how often do you feel.
  1 = nenver; 2 = not often; 3 = sometimes; 4 = often.
response_scale:
  min: 1
  max: 4
  labels:
    1: nenver
    2: not often
    3: sometimes
    4: often

items:
  - id: 1
    text: "I look forward to each day."

  - id: 2
    text: "I feel that my life has meaning."

  - id: 3
    text: "On balance, I look back on my life with a sense of happiness."

  - id: 4
    text: "I feel full of energy these days."

  - id: 5
    text: "I feel that life is full of opportunities."

  - id: 6
    text: "I feel that the future looks good for me."