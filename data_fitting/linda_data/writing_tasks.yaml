- task_id: WT1
  prompt: >
    Write a short reflective paragraph (80–160 words) about how your current employment situation
    influences your daily routine, sense of purpose, stress, and overall life satisfaction.
    Be concrete and consistent with your persona.

- task_id: WT2
  prompt: >
    Write a short reflective paragraph (80–160 words) reflecting on how your work status
    (whether employed full-time, part-time, or currently unemployed) shapes your social connections,
    financial security, and sense of identity. Consider both the practical and emotional dimensions
    of your employment situation, and be specific about how these factors interact in your daily life.
    Be concrete and consistent with your persona.
